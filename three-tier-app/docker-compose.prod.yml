services:

  frontend:
    image: ${DOCKERHUB_USERNAME}/frontend:${IMAGE_TAG}
    container_name: frontend-prod

    ports:
      - "8082:80"

    depends_on:
      - backend

    networks:
      - frontend-network-prod


  backend:
    image: ${DOCKERHUB_USERNAME}/backend:${IMAGE_TAG}
    container_name: backend-prod

    environment:
      DB_HOST: database
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb

    depends_on:
      - database

    networks:
      - frontend-network-prod
      - backend-network-prod


  database:
    image: mysql:8.4
    container_name: database-prod

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword

    volumes:
      - mysql-data-prod:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - backend-network-prod


volumes:
  mysql-data-prod:


networks:

  frontend-network-prod:
    driver: bridge

  backend-network-prod:
    driver: bridge