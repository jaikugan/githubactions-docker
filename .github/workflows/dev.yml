name: Build and Deploy DEV

on:
  push:
    branches:
      - development

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ steps.tag.outputs.image_tag }} \
            ./three-tier-app/frontend

      - name: Build Backend
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ steps.tag.outputs.image_tag }} \
            ./three-tier-app/backend

      - name: Push Frontend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{ steps.tag.outputs.image_tag }}

      - name: Push Backend
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend:${{ steps.tag.outputs.image_tag }}


  deploy-dev:

    needs: build-and-push

    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to DEV
        working-directory: ./three-tier-app

        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

        run: |
          echo "Deploying DEV image: $IMAGE_TAG"

          docker compose \
            -p three-tier-dev \
            -f docker-compose.dev.yml \
            pull

          docker compose \
            -p three-tier-dev \
            -f docker-compose.dev.yml \
            up -d