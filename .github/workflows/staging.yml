name: Promote to STAGING

on:

  workflow_dispatch:

    inputs:

      image_tag:

        description: "Docker image tag to deploy"

        required: true

        type: string


jobs:

  deploy-staging:

    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to STAGING

        working-directory: ./three-tier-app

        env:

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

          IMAGE_TAG: ${{ inputs.image_tag }}

        run: |

          echo "Promoting image to STAGING: $IMAGE_TAG"

          docker compose \
            -p three-tier-staging \
            -f docker-compose.staging.yml \
            pull

          docker compose \
            -p three-tier-staging \
            -f docker-compose.staging.yml \
            up -d